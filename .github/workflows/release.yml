# Publie une nouvelle version quand on pousse un tag vX.Y.Z :
#   git tag v1.1.0
#   git push origin v1.1.0
# Le workflow compile le plugin, crée la release GitHub avec latest.zip,
# puis met à jour repo.json (le fichier que Dalamud lit) sur la branche main.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Télécharger Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev" -Force

      - name: Compiler
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet build AutoStanceXIV/AutoStanceXIV.csproj -c Release -p:Version=$version

      # Si la release existe déjà (tag repoussé, relance du workflow), on remplace juste le zip.
      - name: Créer ou mettre à jour la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = 'AutoStanceXIV/bin/Release/AutoStanceXIV/latest.zip'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "AutoStanceXIV $tag" --generate-notes
          }

      - name: Mettre à jour repo.json
        shell: pwsh
        run: |
          $repoUrl = 'https://github.com/${{ github.repository }}'
          $download = "$repoUrl/releases/download/${{ github.ref_name }}/latest.zip"

          $manifest = Get-Content AutoStanceXIV/bin/Release/AutoStanceXIV/AutoStanceXIV.json -Raw -Encoding utf8 | ConvertFrom-Json
          $extra = [ordered]@{
            RepoUrl             = $repoUrl
            IconUrl             = 'https://raw.githubusercontent.com/${{ github.repository }}/main/AutoStanceXIV/images/icon.png'
            DownloadLinkInstall = $download
            DownloadLinkUpdate  = $download
            DownloadLinkTesting = $download
            LastUpdate          = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          }
          foreach ($key in $extra.Keys) {
            $manifest | Add-Member -NotePropertyName $key -NotePropertyValue $extra[$key] -Force
          }

          git fetch origin main
          git checkout main
          ConvertTo-Json -InputObject @($manifest) -Depth 5 | Set-Content repo.json -Encoding utf8

          # Le commit de repo.json est signé au nom du mainteneur plutôt que du robot github-actions.
          git config user.name 'Arzhael'
          git config user.email '33180615+Arzhaell@users.noreply.github.com'
          git add repo.json
          git commit -m 'repo.json : ${{ github.ref_name }}'
          git push origin main
